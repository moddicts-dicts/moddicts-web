<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Observe — See the shape of the noise</title>
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Iconify CDN -->
    <script src="https://code.iconify.design/iconify-icon/1.0.7/iconify-icon.min.js"></script>
    
    <!-- Google Fonts: Instrument Serif -->
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap');

        :root {
            --bg: #000000;
            --fg: #ffffff;
        }

        .font-serif-instrument {
            font-family: 'Instrument Serif', serif;
        }

        /* LIQUID GLASS CSS */
        .liquid-glass {
            background: rgba(0, 0, 0, 0.10);
            background-blend-mode: luminosity;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.45) 0%,
                rgba(255, 255, 255, 0.15) 20%,
                rgba(255, 255, 255, 0) 40%,
                rgba(255, 255, 255, 0) 60%,
                rgba(255, 255, 255, 0.15) 80%,
                rgba(255, 255, 255, 0.45) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }

        .liquid-glass-circle {
            background-blend-mode: luminosity;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            border: none;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
            position: relative;
            overflow: hidden;
        }

        .liquid-glass-circle::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(
                180deg,
                rgba(255, 255, 255, 0.45) 0%,
                rgba(255, 255, 255, 0.22) 30%,
                rgba(255, 255, 255, 0.16) 50%,
                rgba(255, 255, 255, 0.22) 70%,
                rgba(255, 255, 255, 0.45) 100%
            );
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body class="bg-black text-white min-h-screen selection:bg-white selection:text-black overflow-hidden">

    <div class="bg-black text-white min-h-screen selection:bg-white selection:text-black overflow-hidden">
        <section class="min-h-screen relative overflow-hidden flex flex-col">

            <!-- ANIMATED COSMIC GARDEN BACKGROUND (Pink Galaxy Theme) -->
            <canvas id="cosmic-canvas" class="absolute inset-0 w-full h-full pointer-events-none z-0"></canvas>

            <nav class="relative z-20 px-6 py-6">
                <div class="liquid-glass rounded-full max-w-5xl mx-auto pl-6 pr-1.5 py-1.5 flex items-center justify-between">
                    
                    <!-- Left Group -->
                    <div class="flex items-center gap-2">
                        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true" class="w-6 h-6">
                            <path d="M4.21 16.5 A9 9 0 0 1 16.5 4.21" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
                            <path d="M16.5 4.21 A9 9 0 0 1 19.79 16.5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-dasharray="2.4 2.3"/>
                            <path d="M19.79 16.5 A9 9 0 0 1 4.21 16.5" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-dasharray="0.01 4.7"/>
                            <circle cx="12" cy="12" r="2.5" fill="currentColor"/>
                        </svg>
                        <span class="font-semibold text-lg tracking-tight">Observe</span>
                        
                        <div class="hidden md:flex gap-8 ml-8">
                            <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Product</a>
                            <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Pricing</a>
                            <a href="#" class="text-white/80 hover:text-white text-sm font-medium transition-colors">Contact us</a>
                        </div>
                    </div>

                    <!-- Right Group -->
                    <div class="flex items-center gap-4">
                        <button class="text-white text-sm font-medium">Sign Up</button>
                        <button class="bg-white rounded-full px-5 py-2 text-black text-sm font-medium whitespace-nowrap hover:scale-105 transition-transform duration-300">Join Waitlist</button>
                    </div>

                </div>
            </nav>

            <div class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%]">
                
                <!-- Headline -->
                <h1 class="text-6xl md:text-7xl lg:text-8xl font-serif-instrument tracking-tight whitespace-nowrap mb-4"
                    style="text-shadow: 0 0 72px rgba(0, 0, 0, 0.42), 0 4px 28px rgba(0, 0, 0, 0.28);">
                    See the shape of the <em class="italic">noise</em>
                </h1>

                <!-- Subline -->
                <p class="text-white/70 text-sm leading-relaxed max-w-2xl md:whitespace-nowrap mb-10"
                   style="text-shadow: 0 0 30px rgba(0, 0, 0, 0.32), 0 1px 10px rgba(0, 0, 0, 0.20);">
                    Every event from your product — rendered as one picture you can actually read.
                </p>

                <!-- Email Capture -->
                <div class="max-w-xl w-full">
                    <div class="liquid-glass rounded-full pl-6 pr-1.5 py-1.5 flex items-center gap-3">
                        <input type="email" placeholder="Enter your email"
                               class="bg-transparent border-none outline-none flex-1 text-white placeholder:text-white/90 text-sm">
                        <button class="bg-white rounded-full px-6 py-3 text-black text-sm font-medium whitespace-nowrap hover:scale-105 transition-transform duration-300">Join Waitlist</button>
                    </div>
                </div>

            </div>

            <div class="relative z-10 flex justify-center gap-4 pb-12">
                <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
                    <iconify-icon icon="lucide:instagram" class="text-xl"></iconify-icon>
                </button>
                <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
                    <iconify-icon icon="lucide:twitter" class="text-xl"></iconify-icon>
                </button>
                <button class="liquid-glass-circle w-14 h-14 flex items-center justify-center rounded-full text-white/80 hover:text-white hover:bg-white/5 transition-all">
                    <iconify-icon icon="lucide:globe" class="text-xl"></iconify-icon>
                </button>
            </div>

        </section>
    </div>

    <!-- ANIMATION SCRIPT -->
    <script>
        const canvas = document.getElementById('cosmic-canvas');
        const ctx = canvas.getContext('2d');

        function resize() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resize);
        resize();

        // Twinkling stars
        const stars = Array.from({ length: 160 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 2 + 0.5,
            alpha: Math.random(),
            speed: Math.random() * 0.015 + 0.005
        }));

        // Shooting stars
        let shootingStars = [];
        function triggerShootingStar() {
            shootingStars.push({
                x: Math.random() * canvas.width,
                y: Math.random() * (canvas.height * 0.4),
                len: Math.random() * 70 + 30,
                speed: Math.random() * 10 + 6,
                angle: Math.PI / 4 + (Math.random() * 0.2 - 0.1),
                opacity: 1
            });
        }
        setInterval(triggerShootingStar, 3000);

        // Flying petals
        const petals = Array.from({ length: 40 }, () => ({
            x: Math.random() * canvas.width,
            y: Math.random() * canvas.height,
            size: Math.random() * 7 + 3,
            speedY: Math.random() * 0.6 + 0.2,
            speedX: Math.random() * 0.8 - 0.4,
            angle: Math.random() * Math.PI * 2,
            spin: Math.random() * 0.02 - 0.01,
            color: Math.random() > 0.5 ? 'rgba(255, 150, 210, 0.7)' : 'rgba(255, 200, 240, 0.7)'
        }));

        let galaxyAngle = 0;
        let manX = -120;

        function animate() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Pink-themed deep space background gradient
            let bgGrad = ctx.createRadialGradient(canvas.width / 2, canvas.height * 0.3, 40, canvas.width / 2, canvas.height * 0.3, canvas.width);
            bgGrad.addColorStop(0, '#2b0822');
            bgGrad.addColorStop(0.5, '#140310');
            bgGrad.addColorStop(1, '#000000');
            ctx.fillStyle = bgGrad;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Twinkling stars
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0.2) s.speed = -s.speed;
                ctx.fillStyle = `rgba(255, 255, 255, ${Math.abs(s.alpha)})`;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
                ctx.fill();
            });

            // Twirling Galaxy (Pink/Magenta theme)
            ctx.save();
            let gx = canvas.width / 2;
            let gy = canvas.height * 0.26;
            ctx.translate(gx, gy);
            ctx.rotate(galaxyAngle);
            galaxyAngle += 0.001;

            let galGrad = ctx.createRadialGradient(0, 0, 5, 0, 0, 280);
            galGrad.addColorStop(0, 'rgba(255, 240, 245, 0.9)');
            galGrad.addColorStop(0.3, 'rgba(255, 105, 180, 0.5)');
            galGrad.addColorStop(0.7, 'rgba(186, 85, 211, 0.2)');
            galGrad.addColorStop(1, 'transparent');
            ctx.fillStyle = galGrad;
            ctx.beginPath();
            ctx.ellipse(0, 0, 320, 130, Math.PI / 6, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();

            // Shooting stars
            ctx.lineWidth = 2;
            shootingStars.forEach((st, i) => {
                ctx.save();
                let dx = Math.cos(st.angle) * st.len;
                let dy = Math.sin(st.angle) * st.len;
                let grad = ctx.createLinearGradient(st.x, st.y, st.x - dx, st.y - dy);
                grad.addColorStop(0, `rgba(255, 255, 255, ${st.opacity})`);
                grad.addColorStop(1, 'transparent');
                ctx.strokeStyle = grad;
                ctx.beginPath();
                ctx.moveTo(st.x, st.y);
                ctx.lineTo(st.x - dx, st.y - dy);
                ctx.stroke();
                ctx.restore();

                st.x += Math.cos(st.angle) * st.speed;
                st.y += Math.sin(st.angle) * st.speed;
                st.opacity -= 0.02;
                if (st.opacity <= 0) shootingStars.splice(i, 1);
            });

            // Flower garden landscape (Bottom)
            ctx.save();
            let hillGrad = ctx.createLinearGradient(0, canvas.height * 0.72, 0, canvas.height);
            hillGrad.addColorStop(0, '#1a0515');
            hillGrad.addColorStop(1, '#030103');
            ctx.fillStyle = hillGrad;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height * 0.76);
            ctx.bezierCurveTo(canvas.width * 0.35, canvas.height * 0.68, canvas.width * 0.65, canvas.height * 0.8, canvas.width, canvas.height * 0.74);
            ctx.lineTo(canvas.width, canvas.height);
            ctx.lineTo(0, canvas.height);
            ctx.fill();

            // Glowing pink/magenta flowers
            for (let x = 0; x < canvas.width; x += 30) {
                let hY = canvas.height * 0.76 + Math.sin(x * 0.025) * 15;
                let pulse = (Math.sin(Date.now() * 0.003 + x) + 1) * 0.5;
                ctx.fillStyle = x % 60 === 0 ? `rgba(255, 140, 200, ${0.4 + pulse * 0.5})` : `rgba(255, 180, 220, ${0.4 + pulse * 0.5})`;
                ctx.beginPath();
                ctx.arc(x, hY + 12, 2.5 + pulse * 1.5, 0, Math.PI * 2);
                ctx.fill();
            }
            ctx.restore();

            // Walking man animation
            manX += 0.7;
            if (manX > canvas.width + 80) manX = -120;
            let groundY = canvas.height * 0.76 + Math.sin(manX * 0.025) * 15 - 42;

            ctx.save();
            ctx.fillStyle = '#120510';
            ctx.beginPath();
            ctx.arc(manX, groundY - 22, 7.5, 0, Math.PI * 2);
            ctx.fill();
            ctx.fillRect(manX - 4.5, groundY - 14, 9, 22);
            let legSwing = Math.sin(manX * 0.1) * 6;
            ctx.fillRect(manX - 3.5, groundY + 8, 3, 16 + legSwing);
            ctx.fillRect(manX + 0.5, groundY + 8, 3, 16 - legSwing);
            ctx.restore();

            // Flying petals
            petals.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX + Math.sin(p.angle) * 0.4;
                p.angle += p.spin;

                if (p.y > canvas.height) {
                    p.y = -20;
                    p.x = Math.random() * canvas.width;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                ctx.beginPath();
                ctx.ellipse(0, 0, p.size, p.size * 0.5, 0, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            });

            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
